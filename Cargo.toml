[package]
name = "chess-egt"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1.11"
zeekstd = "0.6.2"
zstd-safe = { version = "7.2.4", features = ["std"] }
clap = { version = "4.4", features = ["derive"] }
shakmaty = "0.30"
arrayvec = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
object_store = { version = "0.14.2", features = ["aws", "azure", "gcp", "http"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-util"] }
url = "2"
bytes = "1"

[[bin]]
name = "chess-egt"
path = "src/bin/main.rs"

[profile.release]
# Tablebase generation is dominated by small hot functions spread across this
# crate and shakmaty, so cross-crate inlining is worth the longer build.
lto = "fat"
codegen-units = 1

# Same codegen as release, but keeps symbols so that callgrind / cachegrind /
# perf can attribute samples. For perf, also build with
# RUSTFLAGS="-C force-frame-pointers=yes".
[profile.profiling]
inherits = "release"
debug = 2
strip = false
